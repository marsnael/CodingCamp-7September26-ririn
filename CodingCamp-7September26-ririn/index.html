<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <header id="greeting-panel">
      <div id="clock-display"></div>
      <div id="date-display"></div>
      <div id="greeting-display"></div>
      <form id="name-form">
        <input id="name-input" type="text" maxlength="50" placeholder="Enter your name" aria-label="Your name">
        <button type="submit">Save</button>
        <span id="name-error" role="alert" aria-live="polite"></span>
      </form>
    </header>

    <main>
      <section id="theme-section">
        <button id="theme-toggle" aria-label="Toggle theme" aria-pressed="false">🌙 Dark</button>
      </section>

      <section id="timer-section">
        <h2>Focus Timer</h2>
        <div id="timer-display">25:00</div>
        <div id="timer-message" role="alert" aria-live="polite"></div>
        <div id="timer-controls">
          <button id="timer-start" aria-label="Start timer">Start</button>
          <button id="timer-stop" disabled aria-label="Stop timer">Stop</button>
          <button id="timer-reset" aria-label="Reset timer">Reset</button>
        </div>
        <form id="duration-form">
          <input id="duration-input" type="number" min="1" max="120" value="25" aria-label="Pomodoro duration in minutes">
          <button type="submit">Set</button>
          <span id="duration-error" role="alert" aria-live="polite"></span>
        </form>
      </section>

      <section id="task-section">
        <h2>Tasks</h2>
        <form id="task-add-form">
          <input id="task-input" type="text" maxlength="255" placeholder="Add a task..." aria-label="New task text" autocomplete="off">
          <button type="submit">Add</button>
          <span id="task-add-error" role="alert" aria-live="polite"></span>
        </form>
        <ul id="task-list"></ul>
        <p id="task-empty-msg">No tasks yet. Add one above!</p>
      </section>

      <section id="links-section">
        <h2>Quick Links</h2>
        <form id="link-add-form">
          <input id="link-label-input" type="text" maxlength="50" placeholder="Label" aria-label="Link label" autocomplete="off">
          <input id="link-url-input" type="url" maxlength="2048" placeholder="URL" aria-label="Link URL" autocomplete="off">
          <button type="submit">Add</button>
          <span id="link-add-error" role="alert" aria-live="polite"></span>
        </form>
        <div id="links-list"></div>
        <p id="links-empty-msg">No quick links saved yet.</p>
      </section>
    </main>

    <div id="storage-warning" role="alert" aria-live="polite"></div>

    <script src="js/app.js"></script>
  </body>
</html>
